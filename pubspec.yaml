name: stockmate
description: "Offline inventory counting with reliable, private cloud submissions."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/catalog.json
    - assets/brand/
