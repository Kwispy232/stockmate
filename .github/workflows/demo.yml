name: Verify and build demo

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_SUPPRESS_ANALYTICS: true
  DART_SUPPRESS_ANALYTICS: true
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_OPT_OUT_USAGE: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - run: bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - run: supabase start -x studio,realtime,storage,imgproxy,edge-runtime,analytics,vector,inbucket,meta
      - run: supabase db reset --local
      - run: bash scripts/check-backend.sh
      - if: always()
        run: supabase stop --no-backup

  build:
    needs: [quality, backend]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Boot matching iOS simulator
        id: simulator
        if: matrix.platform == 'ios'
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          simulator_id=$(python3 scripts/ci_simulator.py)
          echo "Selected simulator: $simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Device integration test
        if: matrix.platform == 'ios'
        timeout-minutes: 20
        run: bash scripts/ci_ios_integration.sh '${{ steps.simulator.outputs.id }}'
      - name: Upload iOS integration diagnostics
        if: always() && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-diagnostics
          path: build/ios-integration/
          if-no-files-found: ignore
          retention-days: 7
      - run: bundle exec fastlane ${{ matrix.platform }} demo
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.platform }}
          path: build/artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: demo-*
          path: release
          merge-multiple: true
      - name: Publish GitHub demo release
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_TAG: demo-${{ github.run_number }}
        run: |
          gh release create "$DEMO_TAG" release/* --target "$GITHUB_SHA" --prerelease \
            --title "StockMate demo #${{ github.run_number }}" --notes-file docs/demo-release.md
